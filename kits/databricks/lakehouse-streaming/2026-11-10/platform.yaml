# From databricks/lakehouse-streaming@2026-11-10
apiVersion: ingestron.io/v1
kind: Platform
id: lakehouse
schedule:
  cron: 0 0 5 * * ? # Quartz cron: the refresh job runs once a day, at 05:00
  timezone: UTC # the time zone the cron is read in
alerts:
  - kind: email
    on: [failure]
    # The address told when a run fails, such as data-team@example.com
    to: [REPLACE_ME]
principals:
  # The group that holds the contracts' role shop-analysts, and so reads the tables, such as marketing-analysts
  shop-analysts: REPLACE_ME
databricks:
  workspace:
    host: ${values.host} # each environment's own, in project.yaml
  run_as:
    # Application ID of the service principal the pipelines and jobs run as
    service_principal_name: REPLACE_ME
  permissions:
    - level: CAN_MANAGE
      group_name: ${values.engineers} # in project.yaml
    - level: CAN_VIEW
      group_name: ${values.analysts} # in project.yaml
  manage:
    checks: true # count the contracts' rules over all rows after each refresh
    tags: true # set each column's classification as a tag, which the masks match
    grants: true # grant each table's contract roles after each refresh
    masks: true # mask the columns whose classification the standard masks
  governance:
    # The schema, as catalog.schema, that holds the mask functions, such as main.governance
    functions: REPLACE_ME
    unmasked:
      - ${values.engineers} # sees real values, as the run_as identity does
