  - { url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/refrn/ALL_CONS_COLUMNS.html", read: 2026-11-12 }
  - { url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/Data-Types.html", read: 2026-11-12 }
  - { url: "https://docs.oracle.com/en/database/oracle/sql-developer-command-line/26.3/sqcug/formatting-query-results.html", read: 2026-11-13 }
  - { url: "https://docs.oracle.com/en/database/oracle/sql-developer-command-line/26.3/sqcug/entering-executing-commands.html", read: 2026-11-13 }
  - { url: "https://docs.oracle.com/en/database/oracle/oracle-database/26/sqpug/SQL-Plus-basics.html", read: 2026-11-13 }
