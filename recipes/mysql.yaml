id: mysql
title: MySQL
kind: catalog
ask:
  who: Someone who can query the INFORMATION_SCHEMA of the MySQL server that holds the tables
  access: Every account can read INFORMATION_SCHEMA, but it shows only the rows of objects the account has some privilege on. Use an account with a privilege, such as SELECT, on every table to be loaded, so that none is left out.
  run: |
    SELECT '' AS table_catalog,
           c.TABLE_SCHEMA AS table_schema,
           c.TABLE_NAME AS table_name,
           c.COLUMN_NAME AS column_name,
           c.ORDINAL_POSITION AS ordinal_position,
           CASE WHEN c.DATA_TYPE IN ('enum', 'set') THEN c.DATA_TYPE ELSE c.COLUMN_TYPE END AS data_type,
           c.IS_NULLABLE AS is_nullable,
           k.ORDINAL_POSITION AS primary_key_position
    FROM information_schema.COLUMNS AS c
    LEFT JOIN (
      SELECT u.TABLE_SCHEMA, u.TABLE_NAME, u.COLUMN_NAME, u.ORDINAL_POSITION
      FROM information_schema.KEY_COLUMN_USAGE AS u
      JOIN information_schema.TABLE_CONSTRAINTS AS t
        ON t.CONSTRAINT_SCHEMA = u.CONSTRAINT_SCHEMA
       AND t.TABLE_NAME = u.TABLE_NAME
       AND t.CONSTRAINT_NAME = u.CONSTRAINT_NAME
      WHERE t.CONSTRAINT_TYPE = 'PRIMARY KEY'
    ) AS k ON k.TABLE_SCHEMA = c.TABLE_SCHEMA
          AND k.TABLE_NAME = c.TABLE_NAME
          AND k.COLUMN_NAME = c.COLUMN_NAME
    WHERE c.TABLE_SCHEMA IN ({schemas})
    ORDER BY c.TABLE_SCHEMA, c.TABLE_NAME, c.ORDINAL_POSITION;
  save: sources/{connection}.catalog.csv
  how: Run the query in the mysql client, MySQL Workbench or another client and export the result as CSV with a header row. In MySQL, a schema is a database, so write the names of the databases that hold the tables.
read: columns
names: { parts: 2, caseSensitive: false }
types:
  - { match: '^tinyint\(1\)( unsigned)?( zerofill)?$', logicalType: boolean }
  - { match: '^(tinyint|smallint|mediumint|int|bigint)(\(\d+\))?( unsigned)?( zerofill)?$', logicalType: integer }
  - { match: '^bit(\(\d+\))?$', logicalType: integer }
  - { match: '^year(\(\d+\))?$', logicalType: integer }
  - {
      match: '^decimal\((\d+),(\d+)\)( unsigned)?( zerofill)?$',
      logicalType: number,
      options: { precision: $1, scale: $2 },
    }
  - { match: '^(float|double)(\(\d+,\d+\))?( unsigned)?( zerofill)?$', logicalType: number }
  - { match: '^date$', logicalType: date }
  - { match: '^(datetime|timestamp)(\(\d+\))?$', logicalType: timestamp }
  - { match: '^time(\(\d+\))?$', logicalType: time }
  - { match: '^(char|varchar)\((\d+)\)$', logicalType: string, options: { maxLength: $2 } }
  - { match: '^(tinytext|text|mediumtext|longtext)$', logicalType: string }
  - { match: '^(binary|varbinary)\(\d+\)$', logicalType: string }
  - { match: '^(tinyblob|blob|mediumblob|longblob)$', logicalType: string }
  - { match: '^(enum|set)$', logicalType: string }
  - { match: '^json$', logicalType: object }
  - { match: '^vector(\(\d+\))?$', logicalType: array }
  - { match: '^(geometry|point|linestring|polygon|multipoint|multilinestring|multipolygon|geometrycollection)$', logicalType: string }
