  - { url: "https://dev.mysql.com/doc/refman/8.4/en/information-schema-introduction.html", read: 2026-11-12 }
  - { url: "https://dev.mysql.com/doc/refman/8.4/en/identifier-case-sensitivity.html", read: 2026-11-12 }
  - { url: "https://dev.mysql.com/doc/refman/8.4/en/data-types.html", read: 2026-11-12 }
  - { url: "https://dev.mysql.com/doc/refman/8.4/en/numeric-type-syntax.html", read: 2026-11-12 }
  - { url: "https://dev.mysql.com/doc/refman/8.4/en/string-type-syntax.html", read: 2026-11-12 }
  - { url: "https://dev.mysql.com/doc/refman/8.4/en/date-and-time-type-syntax.html", read: 2026-11-12 }
